aid: lemonbox
name: LemonBox
description: 'LemonBox (来檬) is a health-technology brand working in AI-generative
  personalized nutrition. Founded in 2016 in Silicon Valley, incubated at the University
  of Chicago Polsky Center in 2017, and accepted into Y Combinator in 2018, it entered
  the Chinese market that year and is now headquartered in Shanghai. LemonBox builds
  individualized daily vitamin and supplement packs from a three-minute FFQ (food frequency
  questionnaire) nutrition assessment scored by its LemonAlgo adaptive engine, then
  fulfills them one pack at a time (MOQ=1) through its Personalization Fulfillment Center
  in Hong Kong. The company reports serving more than 10 million cumulative users as of
  2026 and sells both direct-to-consumer and B2B. Investors include Y Combinator and
  Partech. LemonBox operates a consumer web and WeChat mini-program experience and
  publishes no public developer API, SDK, or developer portal; its agent-facing surface
  is limited to a published /llms.txt and a robots.txt that explicitly allow-lists
  generative-AI crawlers.'
